/* Layout: a fixed 16:9 film frame on pure black, scaled to fit the screen. Every position is in frame pixels (1200 x 675), copied from the reference title card. */
:root{
  --black:#000;
  --type:#c4c3c1;
  --cjk:'Title Kai','Kaiti TC','STKaiti','BiauKai',serif;
  --latin:'Cormorant Garamond','Trajan Pro','Times New Roman',serif;
  --u:calc(min(100vw,177.78vh) / 1200);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--black)}
body{overflow:hidden;display:grid;place-items:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

.frame{position:relative;width:calc(1200 * var(--u));height:calc(675 * var(--u));background:var(--black);
  animation:in 1s ease-out 1.6s both}
@keyframes in{from{opacity:0}to{opacity:1}}

/* Chinese: 92px glyph boxes, centred on the reference characters */
.g{position:absolute;width:calc(92 * var(--u));height:calc(92 * var(--u));
  font:400 calc(92 * var(--u))/1 var(--cjk);color:var(--type);text-align:center;
  -webkit-text-stroke:calc(2.2 * var(--u)) var(--black)}   /* a black outline drawn over the glyph shaves the strokes thinner */
.f{position:absolute;inset:0}
.you {left:calc(522 * var(--u));top:calc(168 * var(--u))}   /* 路 */
.xie {left:calc(496 * var(--u));top:calc(270 * var(--u))}   /* 边 */
.sui {left:calc(612 * var(--u));top:calc(249 * var(--u))}   /* 野 */
.pian{left:calc(581 * var(--u));top:calc(344 * var(--u))}   /* 餐 */

/* 有: 𠂇 (top stroke and sweep) lifted up-left, 月 settles down-right */
.you .a{clip-path:polygon(0 0,100% 0,100% 32%,44% 32%,36.5% 44%,36.5% 64%,34% 64%,34% 82%,0 82%);transform:translate(calc(-7 * var(--u)),calc(-6 * var(--u)))}
.you .b{clip-path:polygon(0 82%,34% 82%,34% 64%,36.5% 64%,36.5% 44%,44% 32%,100% 32%,100% 100%,0 100%);transform:translate(calc(3 * var(--u)),calc(4 * var(--u)))}
/* 片: the long left stroke drifts away from the rest */
.pian .a{clip-path:inset(0 60% 0 0);transform:translate(calc(-9 * var(--u)),calc(5 * var(--u)))}
.pian .b{clip-path:inset(0 0 0 40%);transform:translate(calc(4 * var(--u)),calc(-5 * var(--u)))}
/* 些: 此 nudged up-right, 二 dropped down-left (like 力 and 辶) */
.xie .a{clip-path:polygon(0 0,100% 0,100% 63.5%,27.5% 63.5%,27.5% 67%,0 67%);transform:translate(calc(8 * var(--u)),calc(-10 * var(--u)))}
.xie .b{clip-path:polygon(0 67%,27.5% 67%,27.5% 63.5%,100% 63.5%,100% 100%,0 100%);transform:translate(calc(-12 * var(--u)),calc(10 * var(--u)))}
/* 碎: 石 raised, 卒 dropped (like 里 and 予) */
.sui .a{clip-path:inset(0 54.5% 0 0);transform:translate(calc(-6 * var(--u)),calc(-10 * var(--u)))}
.sui .b{clip-path:inset(0 0 0 45.5%);transform:translate(calc(3 * var(--u)),calc(12 * var(--u)))}

/* English: small caps, first letters taller, baseline on the middle row */
.en{position:absolute;bottom:calc((675 - 339) * var(--u));font:500 calc(39 * var(--u))/.8 var(--latin);
  letter-spacing:.03em;color:var(--type);white-space:nowrap}
.en b{font-weight:500;font-size:1.48em}
.en.l{right:calc((1200 - 477) * var(--u))}
.en.r{left:calc(721 * var(--u))}
