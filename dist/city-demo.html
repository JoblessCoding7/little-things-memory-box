<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><title>Vancouver · Kaohsiung</title>
<link rel="stylesheet" href="city-demo.css">
<link rel="preload" href="assets/city-vancouver-hd.jpg" as="image"><link rel="preload" href="assets/city-kaohsiung-hd.jpg" as="image">
</head>
<body>
<main>
<section id="landing" class="city-landing" data-view="split" aria-label="温哥华与高雄">
<article id="vancouver-scene" class="city city-vancouver" aria-label="温哥华">
<div class="city-scene">
<div class="landscape landscape-back"><img src="assets/city-vancouver-hd.jpg" alt="温哥华的海湾、山脉与城市灯光" fetchpriority="high"></div>
<h1 class="city-title">Vancouver</h1>
<div class="landscape landscape-front" aria-hidden="true"><img src="assets/city-vancouver-hd.jpg" alt=""></div>
<div class="city-caption"><p class="city-name" lang="zh-CN">温哥华</p><time id="vancouver-time" aria-label="温哥华当地时间">··:··:··</time></div>
</div>
</article>
<article id="kaohsiung-scene" class="city city-kaohsiung" aria-label="高雄">
<div class="city-scene">
<div class="landscape landscape-back"><img src="assets/city-kaohsiung-hd.jpg" alt="高雄港口、山脉与高楼" fetchpriority="high"></div>
<h2 class="city-title">Kaohsiung</h2>
<div class="landscape landscape-front" aria-hidden="true"><img src="assets/city-kaohsiung-hd.jpg" alt=""></div>
<div class="city-caption"><p class="city-name" lang="zh-CN">高雄</p><time id="kaohsiung-time" aria-label="高雄当地时间">··:··:··</time></div>
</div>
</article>
<div class="city-seam" aria-hidden="true"></div>
<a href="fragments.html" class="city-zone zone-vancouver" data-city="vancouver" aria-label="进入有些碎片 · 温哥华" aria-controls="vancouver-scene" aria-expanded="false"></a>
<a href="fragments.html" class="city-zone zone-kaohsiung" data-city="kaohsiung" aria-label="进入有些碎片 · 高雄" aria-controls="kaohsiung-scene" aria-expanded="false"></a>
<p class="time-distance" aria-label="高雄比温哥华快十五小时">15 小时</p>
</section>
</main>
<script src="city-demo.js"></script>
</body></html>
