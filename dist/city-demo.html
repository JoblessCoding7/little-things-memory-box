<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><title>Vancouver · Kaohsiung</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="city-demo.css">
<link rel="preload" href="assets/city-vancouver.jpg" as="image"><link rel="preload" href="assets/city-kaohsiung.jpg" as="image">
</head>
<body>
<header class="site-header">
<a class="home" href="#" aria-label="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z"/></svg></a>
<button class="menu-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<nav id="menu" hidden aria-label="页面导航">
<a href="#" aria-label="图片首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z"/></svg></a>
<a href="#collection" aria-label="漂浮收藏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h6v6H3zM15 4h6v6h-6zM5 15h6v6H5zM16 15h5v5h-5z"/></svg></a>
<button id="motion-toggle" aria-label="暂停漂浮动画" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16"/></svg></button>
</nav>
</header>
<main>
<section id="landing" class="city-landing" aria-label="温哥华与高雄">
<a class="city city-vancouver" href="#collection" aria-label="从温哥华进入漂浮收藏">
<div class="city-scene">
<div class="landscape landscape-back"><img src="assets/city-vancouver.jpg" alt="温哥华的海湾、山脉与城市灯光" fetchpriority="high"></div>
<h1 class="city-title">Vancouver</h1>
<div class="landscape landscape-front" aria-hidden="true"><img src="assets/city-vancouver.jpg" alt=""></div>
</div>
<div class="city-caption"><p class="city-name" lang="zh-CN">温哥华</p><time id="vancouver-time" aria-label="温哥华当地时间">··:··:··</time></div>
</a>
<a class="city city-kaohsiung" href="#collection" aria-label="从高雄进入漂浮收藏">
<div class="city-scene">
<div class="landscape landscape-back"><img src="assets/city-kaohsiung.jpg" alt="高雄港口、山脉与高楼" fetchpriority="high"></div>
<h2 class="city-title">Kaohsiung</h2>
<div class="landscape landscape-front" aria-hidden="true"><img src="assets/city-kaohsiung.jpg" alt=""></div>
</div>
<div class="city-caption"><p class="city-name" lang="zh-CN">高雄</p><time id="kaohsiung-time" aria-label="高雄当地时间">··:··:··</time></div>
</a>
<p class="time-distance" aria-label="高雄比温哥华快十五小时">15 小时</p>
</section>
<section id="collection" aria-label="漂浮收藏" hidden><div id="world"></div></section>
</main>
<dialog id="lightbox" aria-label="查看物件"><button class="close" aria-label="关闭大图"><span></span><span></span></button><img alt=""></dialog>
<script src="collection.js"></script><script src="app.js"></script><script src="city-demo.js"></script>
</body></html>
