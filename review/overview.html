<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材 · 已确认</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 32px;background:#101010;color:#fff;font:15px/1.4 -apple-system,BlinkMacSystemFont,sans-serif}header{margin-bottom:20px;display:flex;justify-content:space-between;gap:24px;align-items:center}h1{margin:0 0 6px;font-size:26px;font-weight:600}p{margin:0;color:#aaa;font-size:14px}header a{color:#fff;white-space:nowrap}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px}.item{display:block;color:#eee;text-decoration:none}.image{height:205px;background:#000;padding:10px}.image img{width:100%;height:100%;object-fit:contain}.item span{display:block;padding:8px 0;font-size:14px}.item:hover img{transform:scale(1.025)}.latest main{grid-template-columns:repeat(2,minmax(0,1fr))}.latest .image{height:285px}@media(max-width:700px){body{padding:20px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.image{height:210px}header{display:block}header a{display:block;margin-top:14px}}@media(min-height:1000px) and (min-width:1000px){.image{height:250px}}</style></head><body><header><div><h1>素材预览</h1><p>全部已确认 · 点击图片查看原图对照</p></div><div><a href="overview.html?view=latest">这次的 4 张</a> · <a href="overview.html">全部素材</a> · <a href="index.html">逐张对照 →</a></div></header><main></main><script src="review-data.js"></script><script>const latest=new URLSearchParams(location.search).get('view')==='latest';document.body.classList.toggle('latest',latest);const items=latest?window.reviewItems.filter(i=>i.reviewBatch==='2026-10-15-new'):window.reviewItems;document.querySelector('h1').textContent=(latest?'这次的 ':'')+items.length+' 张素材 · 已确认';document.title=items.length+' 张素材 · 已确认';for(const item of items){const a=document.createElement('a');a.className='item';a.href='index.html#'+item.id;const box=document.createElement('div');box.className='image';const im=new Image();im.src=item.processed;im.alt=item.name;box.append(im);const label=document.createElement('span');label.textContent=item.id.slice(0,2)+' '+item.name;a.append(box,label);document.querySelector('main').append(a);}</script></body></html>
