<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已确认素材对照</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#efefed;color:#191919;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}header{padding:32px 4vw 24px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}p{margin:0;color:#555}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}nav a{display:block;background:white;color:#333;text-decoration:none;padding:8px 12px;border-radius:4px}main{padding:0 4vw 40px}.asset{margin:32px 0 64px;scroll-margin-top:24px}.title{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}.title h2{margin:0;font-size:22px}.title span{font-size:13px;color:#737373}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{min-width:0}.label{padding:0 0 8px;color:#626262}.stage{height:min(64vw,560px);display:block;overflow:hidden;background:#ddd}.stage img{width:100%;height:100%;max-height:100%;object-fit:contain;padding:28px}.processed{background:#000}.stage a{display:block;width:100%;height:100%;min-width:0;min-height:0}.controls{margin-top:10px;display:flex;gap:10px;align-items:center}button{cursor:pointer;padding:8px 13px;border:0;border-radius:4px;background:white;color:#222;font:inherit}button[aria-pressed=true]{background:#222;color:white}.note{margin-top:12px;font-size:14px;color:#8a4b23}.float img{animation:drift 8.37s ease-in-out infinite alternate}@keyframes drift{0%{transform:translate(-9px,5px) rotate(-1.2deg)}47%{transform:translate(7px,-9px) rotate(.7deg)}100%{transform:translate(-3px,10px) rotate(1.6deg)}}.contact{display:block;margin-top:24px}.checker{background:repeating-conic-gradient(#ccc 0% 25%,#eee 0% 50%) 0 0 / 24px 24px}.grey{background:#777}@media(max-width:650px){.pair{grid-template-columns:1fr}.stage{height:92vw}.title{flex-wrap:wrap}.stage img{padding:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><header><h1>已确认素材对照</h1><p>左边原图，右边处理图。15 件素材已确认并接入网站；此页保留原图与处理图对照。</p><a class="contact" href="overview.html">查看全部素材 →</a><nav id="nav"></nav></header><main id="assets"></main><script src="review-data.js"></script><script>
for(const item of window.reviewItems){
 const section=document.createElement('section');section.className='asset';section.id=item.id;
 section.innerHTML=`<div class="title"><h2>${item.id.slice(0,2)} · ${item.name}</h2><span>已确认</span></div><div class="pair"><div class="panel"><div class="label">原图</div><div class="stage"><a href="${item.original}" target="_blank"><img src="${item.original}" alt="${item.name}原图" loading="lazy"></a></div></div><div class="panel"><div class="label">AI 透明底候选 · 黑底预览</div><div class="stage processed"><a href="${item.processed}" target="_blank"><img src="${item.processed}" alt="${item.name}处理图" loading="lazy"></a></div><div class="controls"><button class="backdrop">切换底色</button><button class="motion" aria-pressed="false">试试漂浮</button><a href="${item.processed}" target="_blank">查看大图</a></div></div></div>${item.note?`<p class="note">${item.note}</p>`:''}`;
 let bg=0;section.querySelector('.backdrop').onclick=()=>{bg=(bg+1)%3;const stage=section.querySelector('.processed');stage.classList.remove('grey','checker');if(bg)stage.classList.add(['','grey','checker'][bg]);};section.querySelector('.motion').onclick=e=>{const on=section.querySelector('.processed').classList.toggle('float');e.target.setAttribute('aria-pressed',String(on));};
 document.querySelector('#assets').append(section);const link=document.createElement('a');link.href='#'+item.id;link.textContent=item.id.slice(0,2)+' '+item.name;document.querySelector('#nav').append(link);
}
</script></body></html>
